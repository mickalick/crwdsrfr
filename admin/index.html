		<script type="text/javascript">
			$(document).ready(function() {
				$('body').css('display', 'none');
				$('body').fadeIn(750);

				$('.link').click(function() {
					event.preventDefault();
					newLocation = this.href;

					$('body').fadeOut(1000, newpage);
				});
				function newpage() {
					window.location = newLocation;
				}
				$("a").on('click', function(event) {
    				if (this.hash !== "" && this.pathname === window.location.pathname) {
      					event.preventDefault();

      					var hash = this.hash;

      					$('html, body').animate({
        					scrollTop: $(hash).offset().top
      					}, 650, function(){
        					window.location.hash = hash;
      					});
    				}
  				});
			});
			$(function() {
				var header = $("header");
				var mnuBtn = $("#menuButton");

				$(window).scroll(function() {
					var scroll = $(window).scrollTop();
					if (scroll >= 50) {
						header.addClass("scrolled");
						mnuBtn.addClass("scrolled");
					} else {
						header.removeClass("scrolled");
						mnuBtn.removeClass("scrolled");
					}
				});
			});
		</script>

	<body id="top">
		<header>
			<nav>
				<a id="logo" aria-label="Home" href="/"></a>
				<div id="siteNav"></div>
			</nav>
		</header>
		<div id="wrapper">
			<section id="adminHero" class="page">
				<div class="main">
					<div class="pageHeader">
						<div class="headContent">
							<h1>Site <em>Admin</em></h1>
						</div>
					</div>
				</div>
			</section>
			<section id="adminContent" class="page">
				<div class="main">
					<div class="admin">

						<!-- Loading / signed out / not an admin -->
						<div class="adminGate" id="adminGate">
							<p id="adminGateText">Loading…</p>
							<button type="button" class="adminButton" id="adminGateSignIn" hidden>Sign in</button>
						</div>

						<div id="adminApp" hidden>
							<div class="adminTabsRow">
								<div class="adminTabs" role="tablist" aria-label="Admin sections">
									<button type="button" class="adminTab" role="tab" id="adminTabPosts" aria-controls="adminPanelPosts" aria-selected="true">
										Posts <span class="adminCount" id="adminPostsCount"></span>
									</button>
									<button type="button" class="adminTab" role="tab" id="adminTabReports" aria-controls="adminPanelReports" aria-selected="false" tabindex="-1">
										Reports <span class="adminCount" id="adminReportsCount"></span>
									</button>
								</div>
								<button type="button" class="adminRefresh" id="adminRefresh" hidden>Refresh</button>
							</div>

							<p class="adminStatus" id="adminStatus" role="status" aria-live="polite"></p>

							<!-- Posts -->
							<div class="adminPanel" id="adminPanelPosts" role="tabpanel" aria-labelledby="adminTabPosts">
								<h2 class="adminSubhead">Waiting for review</h2>
								<div class="adminList" id="adminPending"></div>
								<p class="adminEmpty" id="adminPendingEmpty" hidden>All caught up. Nothing is waiting for review.</p>

								<h2 class="adminSubhead">Recently reviewed</h2>
								<div class="adminList" id="adminReviewed"></div>
								<p class="adminEmpty" id="adminReviewedEmpty" hidden>Nothing reviewed yet.</p>
							</div>

							<!-- Reports -->
							<div class="adminPanel" id="adminPanelReports" role="tabpanel" aria-labelledby="adminTabReports" hidden>
								<div class="adminFilterRow" id="adminReportFilter">
									<button type="button" class="toggle-button active" data-reports="open" aria-pressed="true">Open</button>
									<button type="button" class="toggle-button" data-reports="all" aria-pressed="false">All</button>
								</div>
								<div class="adminList" id="adminReportList"></div>
								<p class="adminEmpty" id="adminReportsEmpty" hidden>No open reports.</p>
							</div>
						</div>

					</div>
				</div>
			</section>
