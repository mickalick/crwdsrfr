		<script type="text/javascript">
			$(document).ready(function() {
				$('body').css('display', 'none');
				$('body').fadeIn(750);

				$('.link').click(function() {
					event.preventDefault();
					newLocation = this.href;

					$('body').fadeOut(1000, newpage);
				});
				function newpage() {
					window.location = newLocation;
				}
				$("a").on('click', function(event) {
    				if (this.hash !== "" && this.pathname === window.location.pathname) {
      					event.preventDefault();

      					var hash = this.hash;

      					$('html, body').animate({
        					scrollTop: $(hash).offset().top
      					}, 650, function(){
        					window.location.hash = hash;
      					});
    				}
  				});
			});
			$(function() {
				var header = $("header");
				var mnuBtn = $("#menuButton");

				$(window).scroll(function() {
					var scroll = $(window).scrollTop();
					if (scroll >= 50) {
						header.addClass("scrolled");
						mnuBtn.addClass("scrolled");
					} else {
						header.removeClass("scrolled");
						mnuBtn.removeClass("scrolled");
					}
				});
			});
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	</head>

	<body id="top">
		<header>
			<nav>
				<a id="logo" aria-label="Home" href="/"></a>
				<div id="siteNav"></div>
			</nav>
		</header>
		<div id="wrapper">
			<section id="adminHero" class="page">
				<div class="main">
					<div class="pageHeader">
						<div class="headContent">
							<h1>Site <em>Admin</em></h1>
						</div>
					</div>
				</div>
			</section>

			<!-- Shown while loading, when signed out, and for non-admins. admin.js fills in the message. -->
			<section id="adminState" class="page adminState">
				<div class="main">
					<p id="adminStateText" class="adminStateText">Loading…</p>
					<div id="adminStateActions" class="adminStateActions"></div>
				</div>
			</section>

			<section id="adminContent" class="page adminContent" hidden>
				<div class="main">
					<div class="adminWrap">
						<div class="adminTabs" role="tablist" aria-label="Admin sections">
							<button type="button" role="tab" id="adminTabPosts" class="adminTab" aria-selected="true" aria-controls="adminPanelPosts">Posts</button>
							<button type="button" role="tab" id="adminTabReports" class="adminTab" aria-selected="false" aria-controls="adminPanelReports" tabindex="-1">Reports</button>
						</div>

						<!-- What just happened ("Approved …"), and Refresh -->
						<div class="adminToolbar">
							<p id="adminStatus" class="adminStatus" role="status" aria-live="polite"></p>
							<button type="button" id="adminRefresh" class="adminLinkButton">Refresh</button>
						</div>

						<!-- Posts -->
						<div id="adminPanelPosts" class="adminPanel" role="tabpanel" aria-labelledby="adminTabPosts">
							<section class="adminSection">
								<h2 id="adminPendingHeading" class="adminHeading">Waiting for Review</h2>
								<p class="adminNote">Oldest first. Approved posts show on the site right away.</p>
								<div id="adminPending" class="adminList"></div>
							</section>
							<section class="adminSection">
								<h2 class="adminHeading">Recently Reviewed</h2>
								<p class="adminNote">The last 20 posts you or another admin reviewed. Change your mind here.</p>
								<div id="adminReviewed" class="adminList"></div>
							</section>
						</div>

						<!-- Reports -->
						<div id="adminPanelReports" class="adminPanel" role="tabpanel" aria-labelledby="adminTabReports" hidden>
							<section class="adminSection">
								<h2 id="adminReportsHeading" class="adminHeading">Open Reports</h2>
								<label class="adminCheck">
									<input type="checkbox" id="adminShowClosed">
									<span>Show closed reports too</span>
								</label>
								<div id="adminReportList" class="adminList"></div>
							</section>
						</div>
					</div>
				</div>
			</section>

			<div class="wave-footer"></div>

						<a aria-label="Instagram" href="https://www.instagram.com/crwdsrfr/" target="_blank"><span class="icon" id="insta"></span></a>

			</footer>
