		<script src="https://code.jquery.com/jquery-1.8.2.min.js" integrity="sha256-9VTS8JJyxvcUR+v+RTLTsd0ZWbzmafmlzMmeZO9RFyk=" crossorigin="anonymous"></script>
		<script type="text/javascript">
			$(document).ready(function() {
				$('body').css('display', 'none');
				$('body').fadeIn(750);

				$('.link').click(function() {
					event.preventDefault();
					newLocation = this.href;

					$('body').fadeOut(1000, newpage);
				});
				function newpage() {
					window.location = newLocation;
				}
				$("a").on('click', function(event) {
    				if (this.hash !== "" && this.pathname === window.location.pathname) {
      					event.preventDefault();

      					var hash = this.hash;

      					$('html, body').animate({
        					scrollTop: $(hash).offset().top
      					}, 650, function(){
        					window.location.hash = hash;
      					});
    				}
  				});
			});
			$(function() {
				var header = $("header");
				var mnuBtn = $("#menuButton");

				$(window).scroll(function() {
					var scroll = $(window).scrollTop();
					if (scroll >= 50) {
						header.addClass("scrolled");
						mnuBtn.addClass("scrolled");
					} else {
						header.removeClass("scrolled");
						mnuBtn.removeClass("scrolled");
					}
				});
			});
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

	<body id="top">
		<header>
			<nav>
				<a id="logo" aria-label="Home" href="/"></a>
				<div id="siteNav"></div>
			</nav>
		</header>
		<div id="wrapper">

			<!-- Shown while loading, and for "not found" / "you blocked this person" / errors.
			     profile.js fills in the message. -->
			<section id="profileState" class="page profileState">
				<div class="main">
					<p id="profileStateText" class="profileStateText">Loading profile…</p>
					<div id="profileStateActions" class="profileStateActions"></div>
				</div>
			</section>

			<!-- Everything below stays hidden until a profile loads -->
			<section id="profileHero" class="page profileHero" hidden>
				<div class="main profileHeroInner">
					<div class="profileIdentity">
						<div id="profileAvatar" class="profileAvatar" aria-hidden="true"></div>
						<div class="profileNames">
							<h1 id="profileDisplayName" class="profileDisplayName" hidden></h1>
							<p id="profileUsername" class="profileUsername"></p>
						</div>
					</div>

					<div class="profileActions">
						<!-- Your own profile -->
						<button type="button" id="profileEdit" class="profileButton" hidden>Edit Profile</button>

						<!-- Someone else's profile -->
						<button type="button" id="profileHype" class="profileButton profileHypeButton" aria-pressed="false" hidden>
							<span class="icon iconHype" aria-hidden="true"></span><span id="profileHypeLabel">Hype</span>
						</button>
						<div id="profileMore" class="profileMore" hidden>
							<button type="button" id="profileMoreButton" class="profileMoreButton" aria-label="More options" aria-haspopup="true" aria-expanded="false" aria-controls="profileMoreMenu">
								<span class="icon" id="kbb"></span>
							</button>
							<ul id="profileMoreMenu" class="profileMoreMenu" hidden>
								<li><button type="button" class="profileMoreItem" data-action="message">Message</button></li>
								<li><button type="button" class="profileMoreItem" data-action="block">Block</button></li>
								<li><button type="button" class="profileMoreItem isDanger" data-action="report">Report</button></li>
							</ul>
						</div>
					</div>
				</div>
			</section>

			<section id="profileContent" class="page profileContent" hidden>
				<div class="main">

					<!-- Pro only: sits across the bottom edge of the hero -->
					<div id="profileAnthem" class="profile-anthem profileAnthem" hidden></div>

					<!-- Blurb + facts on the left, Posts/Hyped/About tabs on the right; stacked on small screens -->
					<div class="profileLayout">
						<aside class="profileAbout" aria-label="Profile details">
							<p id="profileBlurb" class="profileBlurb"></p>
							<dl id="profileStats" class="profileStats"></dl>
							<ul id="profileLinks" class="profileLinks" hidden></ul>
						</aside>

						<div class="profileTabsWrap">
							<div class="profileTabs" role="tablist" aria-label="Profile sections">
								<button type="button" role="tab" id="profileTabPosts" class="profileTab" aria-selected="true" aria-controls="profilePanelPosts">Posts</button>
								<button type="button" role="tab" id="profileTabHyped" class="profileTab" aria-selected="false" aria-controls="profilePanelHyped" tabindex="-1">Hyped</button>
								<button type="button" role="tab" id="profileTabAbout" class="profileTab" aria-selected="false" aria-controls="profilePanelAbout" tabindex="-1">About</button>
							</div>

							<div id="profilePanelPosts" class="profilePanel" role="tabpanel" aria-labelledby="profileTabPosts">
								<div class="profilePostsBar">
									<div class="profileFilter" role="group" aria-label="Show posts from">
										<button type="button" class="toggle-button active" data-posts="all" aria-pressed="true">All</button>
										<button type="button" class="toggle-button" data-posts="board" aria-pressed="false">Board</button>
										<button type="button" class="toggle-button" data-posts="profile" aria-pressed="false">Profile</button>
									</div>
									<button type="button" id="profileNewPost" class="profileButton profileNewPost" hidden>
										<span class="icon iconNewPost" aria-hidden="true"></span><span>New Post</span>
									</button>
								</div>
								<div id="profilePosts" class="profilePosts"></div>
							</div>

							<div id="profilePanelHyped" class="profilePanel" role="tabpanel" aria-labelledby="profileTabHyped" hidden>
								<div class="profileFilter" role="group" aria-label="Show hyped">
									<button type="button" class="toggle-button active" data-hyped="event" aria-pressed="true">Shows</button>
									<button type="button" class="toggle-button" data-hyped="act" aria-pressed="false">Acts</button>
									<button type="button" class="toggle-button" data-hyped="venue" aria-pressed="false">Venues</button>
									<button type="button" class="toggle-button" data-hyped="srfr" aria-pressed="false" hidden>SRFRs</button><!-- owner only (profile.js) -->
								</div>
								<ul id="profileHyped" class="profileHyped"></ul>
							</div>

							<!-- Bio, Best/Worst/First, Top 5 Artists, custom prompts, Show History (profile.js fills it in) -->
							<div id="profilePanelAbout" class="profilePanel" role="tabpanel" aria-labelledby="profileTabAbout" hidden>
								<div id="profileAboutTab" class="profileAboutTab"></div>
							</div>
						</div>
					</div>

				</div>
			</section>

			<div class="wave-footer"></div>

				</div>
			</footer>
